version: 2
# Simulator backends release often and break APIs between minor versions. Dependabot opens one
# grouped PR per package root per week; the backend-compat workflow decides whether the new
# versions actually work before `tested` in metasim/sim/_versions.py is bumped.
updates:
  - package-ecosystem: pip
    directory: /packages/metasim
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Deliberate pins: numpy<2 is what the Isaac / PyBullet / SuperDex stacks are built against,
      # setuptools==59.5.0 is the last release with distutils for the robosplatter build, and the
      # torch/CUDA builds are chosen per simulator. The backend-compat workflow, not Dependabot,
      # decides when a simulator stack moves (metasim/sim/_versions.py).
      - dependency-name: "numpy"
      - dependency-name: "setuptools"
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "opencv-python"
      - dependency-name: "isaacsim"
    groups:
      simulators:
        patterns: ["mujoco*", "newton", "warp-lang", "sapien", "pybullet", "genesis-world", "superdex-*", "jax*", "dm-control"]
      python-deps:
        patterns: ["*"]
        exclude-patterns: ["mujoco*", "newton", "warp-lang", "sapien", "pybullet", "genesis-world", "superdex-*", "jax*", "dm-control"]
    labels: ["dependencies", "no-changelog"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-deps:
        patterns: ["*"]
    labels: ["dependencies", "no-changelog"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies", "no-changelog"]
