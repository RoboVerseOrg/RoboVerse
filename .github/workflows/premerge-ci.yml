name: IAM-Instance-Profile Smoke Test

on:
  workflow_dispatch:  # 手动触发；验证好后再换成 push 等触发器

env:
  REGION: us-west-2
  AZ: us-west-2a
  INSTANCE_TYPE: t3.micro        # 便宜点即可，验证用
  IMAGE_ID: ami-0b7f5f52689b2c0d0  # 任选公共 Ubuntu 22.04
  KEY_NAME: Github_CI_SSH_KEY_PAIR # 你已有的密钥对
  INSTANCE_PROFILE: metasim-build-role  # <-- 换成你的 Instance Profile 名
  EC2_USER: ubuntu
  MAX_WAIT_SEC: 120          # 等实例 running 的最长秒数

jobs:
  iam-smoke-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout (no code actually needed)
      uses: actions/checkout@v4

    - name: Install AWS CLI
      run: sudo apt-get update && sudo apt-get install -y awscli

    - name: Launch EC2 with IAM profile
      id: launch
      run: |
        set -euo pipefail
        INSTANCE_ID=$(aws ec2 run-instances \
          --image-id  $IMAGE_ID \
          --instance-type $INSTANCE_TYPE \
          --iam-instance-profile Name=$INSTANCE_PROFILE \
          --key-name $KEY_NAME \
          --subnet-id subnet-0c56793ce29caa78b \   # 换成你的子网
          --security-group-ids sg-03f9110d8d39282ad \ # 换成你的 SG
          --query 'Instances[0].InstanceId' \
          --output text)
        echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV
        echo "Launched $INSTANCE_ID"

        echo "Waiting for instance to enter running state…"
        aws ec2 wait instance-running --instance-ids $INSTANCE_ID --region $REGION

        IP=$(aws ec2 describe-instances \
          --instance-ids $INSTANCE_ID \
          --query 'Reservations[0].Instances[0].PrivateIpAddress' \
          --output text)
        echo "EC2_IP=$IP" >> $GITHUB_ENV
        echo "Instance private IP: $IP"

    - name: Send temporary public key via EC2 Instance Connect
      env:
        SSH_PUB: ${{ secrets.EC2_SSH_PUB }}
      run: |
        echo "$SSH_PUB" > temp.pub
        aws ec2-instance-connect send-ssh-public-key \
          --instance-id $INSTANCE_ID \
          --instance-os-user $EC2_USER \
          --ssh-public-key file://temp.pub \
          --availability-zone $AZ

    - name: Verify credentials inside instance
      run: |
        set -euo pipefail
        ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_IP \
          "aws sts get-caller-identity"
      env:
        EC2_IP: ${{ env.EC2_IP }}

    - name: Terminate test instance (always)
      if: always()
      run: |
        aws ec2 terminate-instances --instance-ids $INSTANCE_ID --region $REGION
