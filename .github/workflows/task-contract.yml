name: Task contract guardrail

# Enforces the backend-free task-architecture conformance guardrail
# (tests/test_task_reset_seed_contract.py): no Tier-1 task may drop reset(seed)
# or add a new step()/close() override beyond the shrink-only allowlists.
# Pure-AST, no simulator/torch — fast and runs on every PR.

on:
  pull_request:
    paths:
      - "roboverse_pack/tasks/**"
      - "tests/test_task_reset_seed_contract.py"
      - ".github/workflows/task-contract.yml"
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  task-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest huggingface_hub
      - name: Run task-contract guardrail
        run: python -m pytest tests/test_task_reset_seed_contract.py tests/test_task_contract_static.py -v
      - name: Every roboverse_data path the packs name exists on the Hub
        # allow: the robot template's placeholder paths; the Blender asset root (a directory prefix the loader lists
        # at run time); openarm_wuji, whose assets are not on the Hub yet (TODO(upload): remove once uploaded);
        # EmbodiedGen / Kujiale (manycore) collections, fetched by their own downloaders, not from the Hub dataset
        run: >-
          python tools/assets/check_manifest.py
          --allow roboverse_data/robots/your_robot roboverse_data/blender roboverse_data/robots/openarm_wuji
          roboverse_data/assets/EmbodiedGenData roboverse_data/scenes/manycore
