name: Tests

# Runs lint + MetaSim's simulator-free suite (packages/metasim, 3.10/3.11) + the whole RoboVerse
# content suite (tests/) on CPU. Everything installs from this checkout: packages/metasim first.
#
# Until this existed, CI ran exactly one test file (see task-contract.yml), so regressions in
# the other ~50 files went unnoticed. metasim is a declared git dependency, so a CPU job can
# install the real thing and exercise the backend-free tasks/robots/learning code for real.
#
# GPU simulators (isaacgym/isaacsim/newton), the heavier optional extras (learn/examples/vla)
# and the roboverse_data asset checkout are NOT available on a stock runner. Tests that need
# them SKIP with a reason naming what is missing (see tests/conftest.py) — they must never be
# skipped to paper over a real failure.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Same ruff version as .pre-commit-config.yaml so local pre-commit and CI agree.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff==0.14.5"
      - name: ruff check
        run: python -m ruff check --output-format=github .
      - name: ruff format --check
        run: python -m ruff format --check .

  metasim-general:
    # MetaSim's own PR gate: the simulator-free suite on both supported CPython versions.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    name: metasim general (${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/metasim/pyproject.toml
      - name: Install MetaSim (CPU torch first so pip cannot pick a CUDA wheel)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e "packages/metasim[dev,examples,mujoco]"
      - name: Simulator-free test suite (coverage floor ratchets up only)
        working-directory: packages/metasim
        env:
          MUJOCO_GL: disable
        # Baseline 2026-09-03: 36% of 27,378 statements. Raise the floor when coverage grows; never lower it.
        run: python -m pytest -k general -q -rs --cov=metasim --cov-report=xml --cov-report=term --cov-fail-under=35
      - name: Coverage summary
        if: always()
        working-directory: packages/metasim
        run: |
          echo "### MetaSim coverage (py${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown --skip-covered --sort=cover | head -60 >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-metasim-py${{ matrix.python-version }}
          path: packages/metasim/coverage.xml
          retention-days: 14

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install RoboVerse (CPU) with test deps
        run: |
          python -m pip install --upgrade pip
          # CPU torch first: with only --extra-index-url pip may still pick the CUDA wheel from PyPI
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e "packages/metasim[dev,examples,mujoco]" -e ".[dev,mujoco]"
      - name: Run test suite
        env:
          # Hosted runners have no EGL/GLX; with MUJOCO_GL=egl `import mujoco` itself fails
          # (eglQueryString on a None library). `disable` skips GL context creation entirely;
          # nothing in tests/ renders on MuJoCo, and the suite is identical locally with this value.
          MUJOCO_GL: disable
        # Baseline 2026-09-03: 61% of 30,237 statements across roboverse_pack + roboverse_learn.
        run: python -m pytest tests/ -rs --cov=roboverse_pack --cov=roboverse_learn --cov-report=xml --cov-report=term --cov-fail-under=58
      - name: Coverage summary
        if: always()
        run: |
          echo "### RoboVerse coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown --skip-covered --sort=cover | head -60 >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-roboverse
          path: coverage.xml
          retention-days: 14

  release-dry-run:
    # What release.yml will do on the next tag, run on every PR so a broken build or a git-URL
    # dependency (which PyPI rejects) is caught before the tag exists.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build twine tomli
      - name: No git-URL dependencies in either [project] table
        run: |
          python - <<'PY'
          import tomli, sys
          bad = []
          for path in ("pyproject.toml", "packages/metasim/pyproject.toml"):
              proj = tomli.load(open(path, "rb"))["project"]
              deps = list(proj.get("dependencies", [])) + [d for ds in proj.get("optional-dependencies", {}).values() for d in ds]
              bad += [f"{path}: {d}" for d in deps if "@ git+" in d or "://" in d]
          if bad:
              print("::error::PyPI rejects direct URL dependencies:\n" + "\n".join(bad)); sys.exit(1)
          print("no direct-URL dependencies")
          PY
      - name: Versions agree
        run: |
          python - <<'PY'
          import tomli, sys
          a = tomli.load(open("pyproject.toml", "rb"))["project"]["version"]
          b = tomli.load(open("packages/metasim/pyproject.toml", "rb"))["project"]["version"]
          print("roboverse-py", a, "roboverse-metasim", b)
          sys.exit(0 if a == b else 1)
          PY
      - run: python -m build --outdir dist packages/metasim && python -m build --outdir dist .
      - run: python -m twine check --strict dist/*
