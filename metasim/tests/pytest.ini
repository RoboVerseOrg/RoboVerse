[pytest]
# pytest configuration for metasim tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths =
    common
    handlers

# Markers for test categorization
markers =
    unit: Pure unit tests without simulator dependencies
    integration: Integration tests requiring simulator instances
    performance: Performance benchmarking tests
    slow: Long-running tests
    gpu: Tests requiring GPU hardware

    # Simulator-specific markers
    pybullet: PyBullet-specific tests
    mujoco: MuJoCo-specific tests
    isaacgym: Isaac Gym-specific tests
    isaaclab: Isaac Lab-specific tests
    sapien: SAPIEN-specific tests
    genesis: Genesis-specific tests
    mjx: MJX-specific tests
    pyrep: PyRep-specific tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Timeout for tests (in seconds)
timeout = 300

# Coverage options
# Add --cov=metasim to addopts to enable coverage reporting

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Parallel execution (if pytest-xdist is installed)
# Add -n auto to addopts to enable parallel test execution
