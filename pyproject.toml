[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roboverse-py"
version = "1.0.0b0"
description = "RoboVerse content, learning, and examples built on MetaSim"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "roboverse-metasim>=1.0.0b0,<1.1",
    "gymnasium",
    "loguru",
    "numpy",
    "pyyaml",
    "scipy",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "roboverse-metasim[dev]>=1.0.0b0,<1.1",
]
assets = ["huggingface-hub", "rootutils", "tyro"]
examples = [
    "imageio[ffmpeg]",
    "opencv-python",
    "pygame",
    "rich",
    "rootutils",
    "stable-baselines3",
    "torchvision",
    "tqdm",
    "tyro",
]
learn = [
    "diffusers",
    "einops",
    "h5py",
    "hydra-core",
    "imageio[ffmpeg]",
    "matplotlib",
    "numcodecs",
    "numpy-quaternion",
    "omegaconf",
    "opencv-python",
    "pandas",
    "pillow",
    "pymunk",
    "robomimic",
    "rsl-rl-lib",
    "seaborn",
    "stable-baselines3",
    "tensordict",
    "torchcfm",
    "torchvision",
    "tqdm",
    "wandb",
    "zarr",
]
sensors = ["trimesh"]
vla = [
    "lerobot",
    "tensorflow",
    "tensorflow-datasets",
    "tensorflow-hub",
    "transformers",
]
genesis = ["roboverse-metasim[genesis]>=1.0.0b0,<1.1"]
isaacgym = ["roboverse-metasim[isaacgym]>=1.0.0b0,<1.1"]
isaacsim = ["roboverse-metasim[isaacsim]>=1.0.0b0,<1.1"]
isaacsim211 = ["roboverse-metasim[isaacsim211]>=1.0.0b0,<1.1"]
mjx = ["roboverse-metasim[mjx]>=1.0.0b0,<1.1"]
mujoco = ["roboverse-metasim[mujoco]>=1.0.0b0,<1.1"]
newton = ["roboverse-metasim[newton]>=1.0.0b0,<1.1"]
superdex = ["roboverse-metasim[superdex]>=1.0.0b0,<1.1"]  # Python 3.12 only
pybullet = ["roboverse-metasim[pybullet]>=1.0.0b0,<1.1"]
robosplatter = ["roboverse-metasim[robosplatter]>=1.0.0b0,<1.1"]
sapien2 = ["roboverse-metasim[sapien2]>=1.0.0b0,<1.1"]
sapien3 = ["roboverse-metasim[sapien3]>=1.0.0b0,<1.1"]

[project.entry-points."metasim.packages"]
roboverse_pack = "roboverse_pack"

[tool.uv]
index-strategy = "unsafe-best-match"

# Monorepo: MetaSim lives in packages/metasim and is developed in lockstep with this package
# (same version, same tag). Declared as a uv workspace member; install it first from the checkout:
#   python -m pip install -e "packages/metasim[mujoco]" -e ".[mujoco]"
[tool.uv.workspace]
members = ["packages/metasim"]

[tool.uv.sources]
roboverse-metasim = { workspace = true }

[tool.uv.pip]
index-url = "https://download.pytorch.org/whl/cu128"
extra-index-url = [
    "https://pypi.org/simple",
    "https://pypi.nvidia.com",
]

[tool.ruff]
line-length = 120
format.preview = true
lint.preview = false
target-version = "py310"
lint.select = [
    "B",    # flake8: bugbear
    "E",    # pycodestyle
    "F",    # pyflakes
    "FA",   # flake8: future annotations
    "I",    # isort
    "PLC",  # pylint
    "PLE",  # pylint
    "PLW",  # pylint
    "UP",   # pyupgrade
    "NPY",  # numpy-specific rules
    "RUF",  # ruff-defined rules
    "T20",  # flake8: check prints
    "D",    # pydocstyle
]
lint.ignore = [
    "B007",  # allow used loop control variable without leading underscore
    "D100",  # allow no docstrings in public module
    "D105",  # allow magic methods without docstring
    "D107",  # allow __init__ without docstring
    "E266",  # allow multiple leading # in comments
    "E402",  # allow imports not at the top of the file
    "E501",  # allow long lines
    "E722",  # allow bare except
    "F403",  # allow `from module import *`
    "F841",  # allow unused variable
    "PLC0206",  # allow directly iterating over a dict
    "PLC0415",  # allow imports not at the top of the file
    "PLC1901",  # allow `if some_string == ""`
    "PLW1514",  # allow open without encoding argument
    "PLW2901",  # allow for loop variable overwriting
    "PLW0602", "PLW0603", "PLW0604",  # allow global variables, TODO: add docstring and remove this
    "UP031",  # allow `%` to be used to format strings
    "NPY002",  # allow legacy `numpy.random` functions
    "RUF003",  # allow ambiguous characters in comments
    "RUF005",  # allow using `+` to concatenate collections
    "RUF009",  # allow function calls in dataclass default values
    "RUF012",  # allow mutable class attributes
    "RUF059",  # allow unused variable
    "PLE0604", # allow __all__ to be nested but still all elements are strings
]
extend-exclude = [
    "wandb",
    "third_party",
    "tmp",
    "roboverse_data",
    "assets",
    "docker",
    # Vendored SimplerEnv (ManiSkill2-real2sim) controller stack — kept byte-identical to
    # upstream for verified bitwise parity; exclude from lint + format.
    "roboverse_pack/tasks/simpler_env/_native/control",
]

[tool.setuptools.packages.find]
include = ["roboverse_pack", "roboverse_pack.*", "roboverse_learn", "roboverse_learn.*"]
exclude = ["metasim", "metasim.*"]
namespaces = true

[tool.setuptools.package-data]
roboverse_pack = [
    "**/*.md",
    "**/*.mdl",
    "**/*.urdf",
    "**/*.usd",
    "**/*.xml",
    "**/*.yaml",
    "**/*.hdr",
    "**/*.json",  # LIBERO native bundles + task metadata
    "**/*.npz",  # LIBERO native_bundles_plus initial states
]

[tool.ruff.lint.per-file-ignores]
## For normal scripts, allow print statements, allow no docstrings
"scripts/**.py" = ["T20", "D"]
# roboverse_learn was excluded from ruff entirely until 2026-09; it now runs with the same F/E/I
# rules as the rest of the tree. The style families below are tracked debt for this directory
# (505 findings at inclusion time): remove a code from this list when its findings are fixed.
"roboverse_learn/**.py" = ["D", "T20", "FA100", "UP006", "UP045", "E731", "B006", "RUF013", "F811"]
"roboverse_learn/vla/pi0/train_config_snippet.py" = ["F821"]  # paste-in snippet for an openpi config, not a module
"tools/**.py" = ["T20", "D"]  # research / diagnostic harnesses
"roboverse_pack/tasks/maniskill/utils/**.py" = ["T20", "D"]
## For get_started scripts, allow no docstrings
"get_started/**.py" = ["D"]
"generation/enums.py" = ["UP035"]
"roboverse_pack/tasks/humanoid/base/types.py" = ["UP007"]
## For special tasks, allow no docstrings
"roboverse_pack/tasks/maniskill/{pick_single_egad,pick_single_ycb,peg_insertion_side}.py" = ["D"]
"roboverse_pack/tasks/open6dor/task/**.py" = ["D"]
## For python files in docs and dashboard folder, allow no docstrings
"docs/**.py" = ["D"]
"dashboard/**.py" = ["D"]
## Test names should carry behavior; requiring docstrings makes tests noisy
"tests/**.py" = ["D"]
## For tasks, allow no docstrings in public modules
"roboverse_pack/tasks/**/*.py" = ["D100"]
## For roboverse_learn, allow no docstrings, allow print
## Temporary disable linting for quick testing
"roboverse_pack/robots/**.py" = ["D"]  # FIXME: whoever in charge of the robot add docstring and remove this
"roboverse_pack/scenes/**.py" = ["D"]  # FIXME: Charlie add docstring and remove this
"roboverse_pack/tasks/calvin/**.py" = ["D"]  # FIXME: Feishi add docstring and remove this
"roboverse_pack/tasks/libero/**.py" = ["D"]  # FIXME: Peihao add docstring and remove this
"roboverse_pack/tasks/rlbench/**.py" = ["D"]  # FIXME: Feishi add docstring and remove this
"roboverse_pack/tasks/robosuite/**.py" = ["D"]  # FIXME: Jiangran add docstring and remove this
"roboverse_pack/tasks/simpler_env/**.py" = ["D"]  # FIXME: Boshi add docstring and remove this
"roboverse_pack/tasks/metaworld/**.py" = ["D"]  # FIXME: Siheng add docstring and remove this

[tool.ruff.lint.isort]
known-first-party = ["metasim", "roboverse_learn", "roboverse_pack", "scripts"]
known-third-party = ["wandb", "isaacsim"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "general: lightweight test that needs no simulator backend",
    "requires_optional(*modules, extra=None): skip unless the optional dependencies are installed",
    "requires_asset(*relpaths): skip unless the roboverse_data assets are present",
]
