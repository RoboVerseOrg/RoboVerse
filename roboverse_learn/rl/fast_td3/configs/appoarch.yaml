# FastTD3 configuration for HandTraj task

# ------------------------------------------------------------------------------
# Environment
# ------------------------------------------------------------------------------
sim: "isaacsim"
robots: ["franka"]
task: "track"
decimation: 4
train_or_eval: "train"
headless: false

# ------------------------------------------------------------------------------
# Seeds & Device
# ------------------------------------------------------------------------------
seed: 1
cuda: true
torch_deterministic: true
device_rank: 0

# ------------------------------------------------------------------------------
# Rollout & Timesteps
# ------------------------------------------------------------------------------
num_envs: 400
num_eval_envs: 400
total_timesteps: 2000000
learning_starts: 10
num_steps: 1

# -------------------------------------------------------------------------------
# Replay, Batching, Discounting
# -------------------------------------------------------------------------------
buffer_size: 20480
batch_size: 32768
gamma: 0.99
tau: 0.1

# -------------------------------------------------------------------------------
# Elite(best trajectory) memory (optional)
# -------------------------------------------------------------------------------
# If enabled, keeps the best episode trajectory seen so far (by episode return) and
# mixes its transitions into replay sampling so the best traj is never "forgotten"
# when the circular replay buffer overwrites old data.
elite_enable: true
# Per-env ratio of elite samples mixed into each update batch (0.0~1.0).
# Actual elite transitions per update = num_envs * round((batch_size/num_envs) * elite_sample_ratio)
elite_sample_ratio: 0.05
# Optional path to save the current best trajectory (TensorDict-like tensors).
elite_save_path: "output/elite/best_traj.pt"
elite_store_on_gpu: true

# -------------------------------------------------------------------------------
# Update Schedule
# -------------------------------------------------------------------------------
policy_frequency: 2
num_updates: 6
# -------------------------------------------------------------------------------
# Optimizer & Network
# -------------------------------------------------------------------------------
critic_learning_rate: 0.0003
actor_learning_rate: 0.0003
weight_decay: 0.1
critic_hidden_dim: 512
actor_hidden_dim: 256
init_scale: 0.01
num_atoms: 101

# -------------------------------------------------------------------------------
# Value Distribution & Exploration
# -------------------------------------------------------------------------------
v_min: 0
v_max: 300.0
policy_noise: 0.001
std_min: 0.01
std_max: 0.4
noise_clip: 0.5

# -------------------------------------------------------------------------------
# Algorithm Flags
# -------------------------------------------------------------------------------
use_cdq: true
compile: true
obs_normalization: true
max_grad_norm: 0.0
amp: true
amp_dtype: "fp16"
disable_bootstrap: false
measure_burnin: 3

# -------------------------------------------------------------------------------
# Logging & Checkpointing
# -------------------------------------------------------------------------------
wandb_project: "get_started_fttd3"
exp_name: "get_started_fttd3"
use_wandb: false
checkpoint_path: null #"/home/server/Desktop/projects/DDDC/models/2025.12.09_21.37.32/hand_traj_150000.pt" #"/home/server/Desktop/projects/DDDC/models/2025.12.09_16.40.45/hand_traj_60000.pt" # null  #"/home/server/Desktop/projects/DDDC/models/2025.12.09_00.31.21/hand_traj_360000.pt" #"/home/server/Desktop/projects/DDDC/models/2025.12.08_16.21.20/hand_traj_150000.pt"
eval_interval: 3000
save_interval: 3000
video_width: 1024
video_height: 1024
